[pytest]
python_files = test_*.py smokesuite_e2e.py
# -s: show each test's START / END line and action log live in the terminal
addopts = -s
markers =
    smoke: Critical business flows — run on every change
    regression: Full regression suite — run before release
    core: P&L filter form - Report view x Report For grid
    filter: P&L filter form - each filter on its own
    combo: P&L filter form - pairwise filter combinations
    cross: P&L filter form - cross-filter combinations
    cascade: P&L filter form - parent/child filter cascades
# Note: --alluredir is NOT set here. conftest.py's pytest_configure hook
# sets it dynamically to automation/reports/<date>/<time>/allure-results/
# for every run, so results from different runs never mix.
